---
- name: Secure server with iptables
  hosts: your_target_hosts
  become: true

  tasks:
    - name: Install required packages
      package:
        name:
          - iptables
          - iptables-persistent
        state: present

    - name: Allow loopback traffic
      iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Allow established and related connections
      iptables:
        chain: INPUT
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow Gitlab on port 22
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 22
        jump: ACCEPT

    - name: Allow SSH on port 2222
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 2222
        jump: ACCEPT

    - name: Allow HTTP on port 80
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 80
        jump: ACCEPT

    - name: Allow HTTPS on port 443
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 443
        jump: ACCEPT

    - name: Set default INPUT policy to DROP
      iptables:
        chain: INPUT
        policy: DROP

    - name: Ensure netfilter-persistent service is enabled and running
      service:
        name: netfilter-persistent
        state: started
        enabled: true
        
    - name: Save iptables rules
      command: netfilter-persistent save