---
- name: service status
  hosts: all
  become: yes
  tasks:
    - name: Start service
      ansible.builtin.service:
        name: nginx
        state: started

    - name: Stop service
      ansible.builtin.service:
        name: nginx
        state: stopped

    - name: Restart service
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: Reload service
      ansible.builtin.service:
        name: nginx
        state: reloaded
        enabled: yes
        disabled: yes

- name: enable service
      ansible.builtin.service:
        name: nginx
        state: enabled
        enabled: yes
        disabed: yes