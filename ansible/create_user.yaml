---
- name: Create useer
  hosts: all
  become: yes
  tasks:
    - name: check if user exist
      command: id deployer
      register: user_check
      ignore_errors: yes
    
    - name: Create if not exist
      user:
        name: deployer
        state: present
      when: user_check.rc != 0

    - name: add several users
      user:
        name: "{{ item.name }}"
        state:  "{{ item.state }}"
        group:  "{{ item.group }}"
      loop:
        - { name: 'behnam', state: 'present', group: 'sudo' }
        - { name: 'milad', state: 'present', group: 'adm' }
        - { name: 'ansible', state: 'present', group: 'sudo' } 