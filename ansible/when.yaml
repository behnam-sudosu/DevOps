---
- name: Use when
  hosts: all
  become: yes
  tasks:
    - name: Check file exist
      command: ls /tmp/file1
        register: file_check
        ignore_eerrors: yes

    - name: Print file exist
      debug:
        msg: "file exist"
      when: file_check.rc == 0

    - name: Print file does not exist
      debug:
        msg: "file does not exist"
      when: file_check.rc != 0


# install package on Debian and RedHat base

    - name: Update apt cache
      ansible.builtin.apt:
        update-cache: yes
    
    - name: Install package on Debian based system
      apt:
        name: vim
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install package on RedHat based system
      yum:
        name: vim
        state: present
      when: ansible_facts['os_family'] == "RedHat"