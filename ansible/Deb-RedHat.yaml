---
- name: Use when
  hosts: all
  become: yes
  tasks:
    - name: Install package on Debian based system
      apt:
        name: vim
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install package on RedHat based system
      yum:
        name: vim
        state: present
      when: ansible_facts['os_family'] == "RedHat"