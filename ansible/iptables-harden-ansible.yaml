---
- name: Harden server with iptables
  hosts: All
  become: true

  tasks:
    - name: Install required packages
      package:
        name:
          - iptables
          - iptables-persistent
        state: present

    - name: Allow loopback INPUT
      iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Allow established and related INPUT
      iptables:
        chain: INPUT
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow GitLab on port 22 INPUT
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 22
        jump: ACCEPT

    - name: Allow SSH on port 2222 INPUT
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 2222
        jump: ACCEPT

    - name: Allow HTTP on port 80 INPUT
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 80
        jump: ACCEPT

    - name: Allow HTTPS on port 443 INPUT
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 443
        jump: ACCEPT

    - name: Set default INPUT policy to DROP
      iptables:
        chain: INPUT
        policy: DROP

    - name: Allow loopback OUTPUT
      iptables:
        chain: OUTPUT
        out_interface: lo
        jump: ACCEPT

    - name: Allow established and related OUTPUT
      iptables:
        chain: OUTPUT
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow GitLab on port 22 OUTPUT
      iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: 22
        jump: ACCEPT

    - name: Allow SSH on port 2222 OUTPUT
      iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: 2222
        jump: ACCEPT

    - name: Allow HTTP on port 80 OUTPUT
      iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: 80
        jump: ACCEPT

    - name: Allow HTTPS on port 443 OUTPUT
      iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: 443
        jump: ACCEPT

    - name: Set default OUTPUT policy to DROP
      iptables:
        chain: OUTPUT
        policy: DROP

    - name: Ensure netfilter-persistent service is enabled and running
      service:
        name: netfilter-persistent
        state: started
        enabled: true

    - name: Save iptables rules
      command: netfilter-persistent save